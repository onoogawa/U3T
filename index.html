<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T1K0QZPTLV"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-T1K0QZPTLV');
    </script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U3T</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="page-header">
        <h1>Ultimate Tic-Tac-Toe</h1>

        <details id="auth-panel">
            <summary>アカウント</summary>

            <div id="auth-content">

                <div id="auth-form">
                <input
                    type="email"
                    id="auth-email"
                    placeholder="メールアドレス"
                    autocomplete="email"
                >

                <input
                    type="password"
                    id="auth-password"
                    placeholder="パスワード（6文字以上）"
                    autocomplete="current-password"
                >

                <div id="auth-buttons">
                    <button id="signup-button">新規登録</button>
                    <button id="login-button">ログイン</button>
                </div>
            </div>

            <div id="auth-user-panel" hidden>
                <p id="auth-user-info"></p>
                <button id="logout-button">ログアウト</button>
            </div>

            <div id="saved-games-panel" hidden>
                <h3>保存した対局</h3>

                <button id="refresh-saved-games-button">
                    対局一覧を更新
                </button>

                <p id="saved-games-message"></p>

                <ol id="saved-games-list"></ol>
            </div>

            <p id="auth-message" role="status" aria-live="polite"></p>

                </div>
        </details>
    </header>
    
    <section id="online-room-panel">
        <h2>オンライン対戦</h2>

        <div id="room-create-area">
            <button id="create-room-button">
                対局ルームを作成
            </button>
        </div>

        <div id="room-join-area">
            <input
                type="text"
                id="room-code-input"
                placeholder="8桁の参加コード"
                maxlength="8"
                autocomplete="off"
            >

            <button id="join-room-button">
                ルームに参加
            </button>
        </div>

        <div id="active-room-panel" hidden>
            <p>ルームコード</p>

            <div class="room-code-row">
                <strong id="active-room-code"></strong>
                <button id="copy-room-code-button">コピー</button>
            </div>

            <p id="room-status-display"></p>

            <button id="refresh-room-button">
                ルーム状態を更新
            </button>

            <button id="rematch-room-button" hidden>
                再戦する
            </button>

            <button id="leave-room-button" class="danger-button">
                ルームから退出
            </button>
        </div>
    </section>

    <p id="status">準備中...</p>

    <p id="room-message" role="status" aria-live="polite">
    オンライン対戦にはログインが必要です。
    </p>

    <div id="game-layout">
        <div id="game-main">
            <div id="board"></div>
            <button id="reset-button">新しい対局</button>
        </div>

        <div id="move-history">
            <h2>棋譜</h2>
            <button id="return-to-game-button" hidden>
                対局に戻る
            </button>

            <div id="replay-controls">
                <button id="previous-move-button" disabled>
                    ← 1手戻る
                </button>
                <button id="next-move-button" disabled>
                    1手進む →
                </button>
            </div>
            
            <ol id="move-list"></ol>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
